<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web Component - Journey Extras</title>
  <link rel="stylesheet" href="./groupui-theme.css">
  <link rel="stylesheet" href="./styles.css?v=aftersales-extras-1">
  <script type="module">
    import { defineCustomElements } from '@group-ui/group-ui/dist/loader/index.es2017.js';

    defineCustomElements().catch((error) => {
      console.error('GroupUI custom elements failed to load', error);
    });
  </script>
  <style>
    body {
      margin: 0;
      background: var(--onefe-bg);
    }

    journey-extras-remote {
      display: block;
    }

    .extras-root {
      display: grid;
      gap: 20px;
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }

    .extras-form,
    .extras-summary {
      display: grid;
      gap: 18px;
    }

    .extras-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .extras-field {
      display: grid;
      gap: 8px;
    }

    .extras-field span,
    .extras-checks legend {
      color: var(--onefe-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .extras-checks {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .extras-checks label {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--groupui-sys-color-line-weak);
      border-radius: var(--groupui-sys-border-radius-s);
      background: var(--groupui-sys-color-background-base);
    }

    .extras-checks small {
      color: var(--groupui-sys-color-text-weaker);
    }

    .extras-summary pre {
      margin: 0;
    }

    @media (max-width: 760px) {
      .extras-grid {
        grid-template-columns: 1fr;
      }

      .extras-checks label {
        grid-template-columns: auto 1fr;
      }

      .extras-checks label > strong {
        grid-column: 2;
      }
    }
  </style>
</head>
<body data-theme="light">
  <journey-extras-remote></journey-extras-remote>

  <script type="module">
    import { serviceExtras as aftersalesExtras } from './packages/demo-data/src/cases.js';

    function deserializeParam() {
      const url = new URL(window.location.href);
      const raw = url.searchParams.get('context');
      if (!raw) return {};
      try {
        return JSON.parse(decodeURIComponent(raw));
      } catch {
        return {};
      }
    }

    const context = deserializeParam();
    const isAftersales = context.journeyType !== 'flight-booking';
    const initialExtras = context.serviceExtras || context.selectedServiceExtras || context.selectedFlightExtras || context.flightBooking?.flightExtras || {};

    const flightSeatPrices = {
      standard: 0,
      window: 18,
      extraLegroom: 42
    };

    const flightBaggagePrices = {
      cabin: 0,
      checked: 35,
      sports: 65
    };

    class JourneyExtrasRemote extends HTMLElement {
      constructor() {
        super();
        this.state = isAftersales
          ? {
              selectedIds: (initialExtras.selectedExtras || []).map((item) => item.id),
              mobilityNeed: initialExtras.mobilityNeed || 'none',
              partsStatus: initialExtras.partsStatus || 'check-pending',
              campaignStatus: initialExtras.campaignStatus || 'no-active-campaign',
              followUpRequired: initialExtras.followUpRequired ?? false
            }
          : {
              seat: initialExtras.seatCode || 'window',
              baggage: initialExtras.baggageCode || 'checked',
              priorityBoarding: initialExtras.priorityBoarding ?? true,
              carbonOffset: initialExtras.carbonOffset ?? false
            };

        try {
          this.channel = new BroadcastChannel(`onefe-channel-${context.caseId || 'unknown'}`);
        } catch {
          this.channel = null;
        }
      }

      connectedCallback() {
        this.render();
        this.bindEvents();
      }

      get selectedExtras() {
        const selectedItems = aftersalesExtras.filter((item) => this.state.selectedIds.includes(item.id));
        return {
          selectedExtras: selectedItems,
          mobilityNeed: this.state.mobilityNeed,
          partsStatus: this.state.partsStatus,
          campaignStatus: this.state.campaignStatus,
          followUpRequired: this.state.followUpRequired,
          totalPrice: selectedItems.reduce((sum, item) => sum + item.price, 0)
        };
      }

      get selectedFlightExtras() {
        const seatLabels = {
          standard: 'Standardplatz',
          window: 'Fensterplatz',
          extraLegroom: 'Extra Beinfreiheit'
        };

        const baggageLabels = {
          cabin: 'Nur Handgepäck',
          checked: 'Aufgabegepäck 23 kg',
          sports: 'Sportgepäck'
        };

        const priorityPrice = this.state.priorityBoarding ? 12 : 0;
        const carbonPrice = this.state.carbonOffset ? 8 : 0;

        return {
          seatCode: this.state.seat,
          seat: seatLabels[this.state.seat],
          baggageCode: this.state.baggage,
          baggage: baggageLabels[this.state.baggage],
          priorityBoarding: this.state.priorityBoarding,
          carbonOffset: this.state.carbonOffset,
          totalPrice: flightSeatPrices[this.state.seat] + flightBaggagePrices[this.state.baggage] + priorityPrice + carbonPrice
        };
      }

      updateState(partialState) {
        this.state = {
          ...this.state,
          ...partialState
        };
        this.render();
        this.bindEvents();
      }

      toggleAftersalesExtra(extraId, checked) {
        const selectedIds = checked
          ? [...new Set([...this.state.selectedIds, extraId])]
          : this.state.selectedIds.filter((id) => id !== extraId);
        this.updateState({ selectedIds });
      }

      postPayload() {
        const payload = isAftersales
          ? {
              type: 'service-extras-transfer',
              from: 'webcomponents-aftersales-extras-target',
              targetApp: 'react-shell',
              note: `Service extras selected: ${this.selectedExtras.totalPrice} EUR`,
              serviceExtras: this.selectedExtras,
              context: {
                ...context,
                sourceStep: 'service-extras-selected',
                selectedServiceExtras: this.selectedExtras.selectedExtras,
                serviceExtras: this.selectedExtras
              }
            }
          : {
              type: 'flight-extras-transfer',
              from: 'stencil-flight-extras-target',
              targetApp: 'react-shell',
              note: `Extras übernommen: ${this.selectedFlightExtras.totalPrice} EUR`,
              flightExtras: this.selectedFlightExtras,
              context: {
                ...context,
                sourceStep: 'flight-extras-selected',
                selectedFlightExtras: this.selectedFlightExtras
              }
            };

        this.channel?.postMessage(payload);

        if (window.opener && window.opener.postMessage) {
          window.opener.postMessage(payload, '*');
        }

        if (window.parent && window.parent !== window && window.parent.postMessage) {
          window.parent.postMessage(payload, '*');
        }

        const status = this.querySelector('#extrasStatus');
        if (status) {
          status.textContent = isAftersales
            ? `Extras an Host übergeben: ${this.selectedExtras.totalPrice} EUR`
            : `Extras an Host übergeben: ${this.selectedFlightExtras.totalPrice} EUR`;
          status.hidden = false;
        }
      }

      bindEvents() {
        if (isAftersales) {
          this.querySelectorAll('[data-extra-id]').forEach((input) => {
            input.addEventListener('change', (event) => {
              this.toggleAftersalesExtra(event.target.dataset.extraId, event.target.checked);
            });
          });

          this.querySelector('#mobilitySelect')?.addEventListener('groupuiChange', (event) => {
            this.updateState({ mobilityNeed: event.target.value });
          });

          this.querySelector('#partsStatusSelect')?.addEventListener('groupuiChange', (event) => {
            this.updateState({ partsStatus: event.target.value });
          });

          this.querySelector('#campaignStatusSelect')?.addEventListener('groupuiChange', (event) => {
            this.updateState({ campaignStatus: event.target.value });
          });

          this.querySelector('#followUpRequired')?.addEventListener('change', (event) => {
            this.updateState({ followUpRequired: event.target.checked });
          });
        } else {
          this.querySelector('#seatSelect')?.addEventListener('groupuiChange', (event) => {
            this.updateState({ seat: event.target.value });
          });

          this.querySelector('#baggageSelect')?.addEventListener('groupuiChange', (event) => {
            this.updateState({ baggage: event.target.value });
          });

          this.querySelector('#priorityCheck')?.addEventListener('change', (event) => {
            this.updateState({ priorityBoarding: event.target.checked });
          });

          this.querySelector('#carbonCheck')?.addEventListener('change', (event) => {
            this.updateState({ carbonOffset: event.target.checked });
          });
        }

        this.querySelector('#submitExtras')?.addEventListener('click', () => this.postPayload());
      }

      renderAftersales() {
        const extras = this.selectedExtras;

        this.innerHTML = `
          <main class="extras-root">
            <groupui-card padding="24px">
              <groupui-tag>Web Component Target</groupui-tag>
              <groupui-headline heading="h1">Extras und Mobilität auswählen</groupui-headline>
              <groupui-text>
                ${context.vehicleModel || 'Volkswagen ID.7 Tourer'} · ${context.appointmentDate || 'Termin offen'} · ${context.servicePackageLabel || 'Paket offen'}
              </groupui-text>
            </groupui-card>

            <groupui-card padding="24px" class="extras-form">
              <groupui-headline heading="h2">Optionale Leistungen</groupui-headline>
              <groupui-text>Dieses Custom Element hält eigenen State und gibt Teile-, Mobilitäts- und Extras-Entscheidungen strukturiert zurück.</groupui-text>

              <fieldset class="extras-checks">
                <legend>Extras</legend>
                ${aftersalesExtras.map((item) => `
                  <label>
                    <input type="checkbox" data-extra-id="${item.id}" ${this.state.selectedIds.includes(item.id) ? 'checked' : ''} />
                    <span>
                      <strong>${item.label}</strong>
                      <small>${item.type} · ${item.availability}</small>
                    </span>
                    <strong>${item.price} EUR</strong>
                  </label>
                `).join('')}
              </fieldset>

              <div class="extras-grid">
                <groupui-select id="mobilitySelect" value="${this.state.mobilityNeed}">
                  <span slot="label">Mobility need</span>
                  <groupui-select-option value="none">No mobility support</groupui-select-option>
                  <groupui-select-option value="shuttle">Shuttle service</groupui-select-option>
                  <groupui-select-option value="replacement-vehicle">Replacement vehicle</groupui-select-option>
                </groupui-select>

                <groupui-select id="partsStatusSelect" value="${this.state.partsStatus}">
                  <span slot="label">Parts status</span>
                  <groupui-select-option value="check-pending">Check pending</groupui-select-option>
                  <groupui-select-option value="available">Available</groupui-select-option>
                  <groupui-select-option value="ordered">Ordered</groupui-select-option>
                </groupui-select>

                <groupui-select id="campaignStatusSelect" value="${this.state.campaignStatus}">
                  <span slot="label">Campaign status</span>
                  <groupui-select-option value="no-active-campaign">No active campaign</groupui-select-option>
                  <groupui-select-option value="campaign-found">Campaign found</groupui-select-option>
                </groupui-select>

                <label class="extras-field">
                  <span>Follow-up</span>
                  <input id="followUpRequired" type="checkbox" ${this.state.followUpRequired ? 'checked' : ''} />
                </label>
              </div>

              <groupui-button id="submitExtras" type="button">Extras an Shell übergeben</groupui-button>
              <groupui-text id="extrasStatus" class="save-message" hidden></groupui-text>
            </groupui-card>

            <groupui-card padding="24px" class="extras-summary">
              <groupui-tag>Selection summary</groupui-tag>
              <groupui-headline heading="h3">Aktuelle Auswahl</groupui-headline>
              <pre>${JSON.stringify(extras, null, 2)}</pre>
            </groupui-card>
          </main>
        `;
      }

      renderFlight() {
        const extras = this.selectedFlightExtras;

        this.innerHTML = `
          <main class="extras-root">
            <groupui-card padding="24px">
              <groupui-tag>Web Component · Stencil-style</groupui-tag>
              <groupui-headline heading="h1">Reise-Extras auswählen</groupui-headline>
              <groupui-text>
                ${context.origin || 'Hannover'} → ${context.destination || 'Barcelona'} · ${context.departureDate || 'Datum offen'} · ${context.flightBooking?.flightOption?.label || 'Flugoption offen'}
              </groupui-text>
            </groupui-card>

            <groupui-card padding="24px" class="extras-form">
              <groupui-headline heading="h2">Zusatzleistungen</groupui-headline>
              <groupui-text>Dieses Custom Element hält eigenen State und sendet die ausgewählten Extras als strukturierten Payload zurück.</groupui-text>

              <div class="extras-grid">
                <groupui-select id="seatSelect" value="${this.state.seat}">
                  <span slot="label">Sitzplatz</span>
                  <groupui-select-option value="standard">Standardplatz · 0 EUR</groupui-select-option>
                  <groupui-select-option value="window">Fensterplatz · 18 EUR</groupui-select-option>
                  <groupui-select-option value="extraLegroom">Extra Beinfreiheit · 42 EUR</groupui-select-option>
                </groupui-select>

                <groupui-select id="baggageSelect" value="${this.state.baggage}">
                  <span slot="label">Gepäck</span>
                  <groupui-select-option value="cabin">Nur Handgepäck · 0 EUR</groupui-select-option>
                  <groupui-select-option value="checked">Aufgabegepäck 23 kg · 35 EUR</groupui-select-option>
                  <groupui-select-option value="sports">Sportgepäck · 65 EUR</groupui-select-option>
                </groupui-select>
              </div>

              <fieldset class="extras-checks">
                <legend>Optionen</legend>
                <label>
                  <input id="priorityCheck" type="checkbox" ${this.state.priorityBoarding ? 'checked' : ''} />
                  <span><strong>Priority Boarding</strong><small>Schnelleres Boarding</small></span>
                  <strong>12 EUR</strong>
                </label>
                <label>
                  <input id="carbonCheck" type="checkbox" ${this.state.carbonOffset ? 'checked' : ''} />
                  <span><strong>CO2-Ausgleich</strong><small>Nachhaltigkeitsbeitrag</small></span>
                  <strong>8 EUR</strong>
                </label>
              </fieldset>

              <groupui-button id="submitExtras" type="button">Extras an Shell übergeben</groupui-button>
              <groupui-text id="extrasStatus" class="save-message" hidden></groupui-text>
            </groupui-card>

            <groupui-card padding="24px" class="extras-summary">
              <groupui-tag>Selection summary</groupui-tag>
              <groupui-headline heading="h3">Aktuelle Auswahl</groupui-headline>
              <pre>${JSON.stringify(extras, null, 2)}</pre>
            </groupui-card>
          </main>
        `;
      }

      render() {
        if (isAftersales) {
          this.renderAftersales();
          return;
        }

        this.renderFlight();
      }
    }

    if (!customElements.get('journey-extras-remote')) {
      customElements.define('journey-extras-remote', JourneyExtrasRemote);
    }
  </script>
</body>
</html>
